<title>AI News Workbench</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--surface:#1a1d27;--border:#2a2d37;--text:#e2e4e9;--muted:#8b8fa3;--accent:#60a5fa;--p0:#ef4444;--p1:#f59e0b;--p2:#22c55e;--sidebar-w:260px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}
.sidebar{width:var(--sidebar-w);background:#13151d;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-header h2{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px}
.sidebar-header .date{font-size:11px;color:var(--muted);margin-top:3px}
.sidebar-menu{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--border);padding:6px 8px}
.menu-item{display:flex;align-items:center;gap:9px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:7px;transition:all .15s;user-select:none}
.menu-item:hover{background:rgba(96,165,250,.06);color:var(--text)}
.menu-item.active{background:rgba(96,165,250,.12);color:var(--accent)}
.menu-item .menu-icon{font-size:14px;width:18px;text-align:center}
.menu-item .menu-label{flex:1}
.menu-item .menu-badge{font-size:10px;background:rgba(96,165,250,.15);color:var(--accent);padding:1px 6px;border-radius:10px;font-weight:700}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.main-header h1{font-size:18px;font-weight:700;color:#fff}
.main-header .actions{display:flex;gap:8px}
.btn-refresh{background:rgba(96,165,250,.12);color:var(--accent);border:none;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.btn-refresh:hover{background:rgba(96,165,250,.22)}
.btn-open-html{background:transparent;color:var(--muted);border:1px solid var(--border);padding:7px 14px;border-radius:7px;font-size:12px;cursor:pointer}
.btn-open-html:hover{border-color:var(--accent);color:var(--accent)}
.main-body{flex:1;overflow-y:auto;padding:20px 24px}
.section{margin-bottom:24px}
.section-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:10px;padding-left:8px;display:flex;align-items:center;gap:7px}
.section-title .count{font-size:11px;color:var(--muted);font-weight:400}
.section:nth-child(2) .section-title{border-left:3px solid var(--p0)}
.section:nth-child(3) .section-title{border-left:3px solid var(--p1)}
.section:nth-child(4) .section-title{border-left:3px solid var(--p2)}
.news-list{display:flex;flex-direction:column;gap:7px}
.news-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px;transition:border-color .2s,transform .12s;cursor:pointer}
.news-card:hover{border-color:#3d4150;transform:translateY(-1px)}
.news-card .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px}
.news-card .card-title{font-size:13.5px;font-weight:600;color:#f0f2f5;line-height:1.45;flex:1}
.news-card .priority-badge{flex-shrink:0;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;margin-left:8px}
.badge-p0{background:rgba(239,68,68,.15);color:var(--p0)}
.badge-p1{background:rgba(245,158,11,.15);color:var(--p1)}
.badge-p2{background:rgba(34,197,94,.15);color:var(--p2)}
.news-card .card-summary{font-size:12px;color:#9ca3af;line-height:1.55;margin-bottom:7px}
.news-card .card-bottom{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.news-card .card-source{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.source-qbitai{background:rgba(96,165,250,.12);color:#60a5fa}
.source-openai{background:rgba(34,197,94,.12);color:#22c55e}
.source-tmtpost{background:rgba(168,85,247,.12);color:#a855f7}
.source-ifanr{background:rgba(251,146,60,.12);color:#fb923c}
.news-card .card-tags{font-size:10px;color:var(--muted)}
.news-card .card-link{margin-left:auto;font-size:11px;color:var(--accent);text-decoration:none;white-space:nowrap}
.news-card .card-link:hover{text-decoration:underline}
.search-bar{position:relative;margin-bottom:16px}
.search-bar input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 12px 9px 34px;font-size:13px;color:var(--text);outline:none}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:#4b5063}
.search-bar .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.filter-bar{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.filter-chip{padding:4px 11px;border-radius:18px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .15s}
.filter-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(96,165,250,.08)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state .icon{font-size:44px;margin-bottom:14px}
.empty-state p{font-size:13px;line-height:1.8}
.empty-state .btn{display:inline-block;margin-top:14px;background:rgba(96,165,250,.12);color:var(--accent);border:none;padding:9px 22px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
.loading{text-align:center;padding:40px;color:var(--muted)}
.loading .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.notes-area{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--text);resize:none;outline:none;font-family:inherit;line-height:1.7;min-height:200px}
.note-history{margin-top:14px}
.note-history h4{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.note-entry{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:5px;font-size:12px;color:var(--muted);cursor:pointer}
.note-entry:hover{border-color:#3d4150;color:var(--text)}
.note-entry .note-time{font-size:10px;color:#4b5063;margin-bottom:3px}
</style>

<body>
<aside class="sidebar">

    <h2>🤖 AI 工作台</h2>
    <div class="date" id="sidebarDate"></div>
  </div>
  <div class="sidebar-menu">
    <div class="menu-item active" data-panel="news" onclick="switchPanel('news')"><span class="menu-icon">📡</span><span class="menu-label">每日推送</span><span class="menu-badge" id="newsBadge">--</span></div>
    <div class="menu-item" data-panel="notes" onclick="switchPanel('notes')"><span class="menu-icon">✏️</span><span class="menu-label">思考速记</span></div>
    <div class="menu-item" data-panel="investment" onclick="switchPanel('investment')"><span class="menu-icon">📈</span><span class="menu-label">投资参考</span></div>
    <div class="menu-item" data-panel="inspiration" onclick="switchPanel('inspiration')"><span class="menu-icon">💡</span><span class="menu-label">每日灵感</span></div>
  </div>
</aside>
<main class="main">
  <header class="main-header">
    <h1 id="mainTitle">📰 AI 日报</h1>
    <div class="actions">
      <button class="btn-refresh" onclick="reloadData()">🔄 刷新数据</button>
      <button class="btn-open-html" onclick="openFullHTML()">📄 打开完整日报</button>
    </div>
  </header>
  <div class="main-body" id="mainBody">
    <div id="panelContent"><div class="loading"><div class="spinner"></div><div>正在加载数据...</div></div></div>
  </div>
</main>
<script>
var DATA_DIR = '';
var allItems = [];
var currentFilter = 'all';
var currentSearch = '';

document.addEventListener('DOMContentLoaded', function() {
  var today = new Date().toISOString().slice(0,10);
  document.getElementById('sidebarDate').textContent = today;
  if (window.__AI_DATA__ && window.__AI_DATA__.length > 0) {
    allItems = window.__AI_DATA__;
    doRender();
  } else {
    loadFromServer(today);
  }
});

async function loadFromServer(today) {
  try {
    var resp = await fetch('ai-data-' + today + '.json');
    if (!resp.ok) throw new Error();
    allItems = await resp.json();
    doRender();
  } catch(e) { showEmpty(); }
}

function showEmpty() {
  document.getElementById('panelContent').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂未找到今日数据</p><button class="btn" onclick="location.reload()">重试</button></div>';
}

function doRender() {
  renderMain();
  var badge = document.getElementById('newsBadge');
  if (badge) badge.textContent = allItems.length;
}

function renderMain() {
  var filtered = getFilteredItems();
  var p0 = filtered.filter(function(i){return i.priority===0});
  var p1 = filtered.filter(function(i){return i.priority===1});
  var p2 = filtered.filter(function(i){return i.priority===2});
  var today = allItems.length > 0 ? (allItems[0].created_at || '').slice(0,10) : '';
  document.getElementById('mainTitle').textContent = '📰 AI 日报 · ' + today;
  var html = '<div class="search-bar"><span class="search-icon">🔍</span><input type="text" placeholder="搜索标题或摘要..." oninput="onSearch(this.value)"></div>';
  html += '<div class="filter-bar">';
  html += makeFilterChip('all', '全部', filtered.length);
  html += makeFilterChip('0', '🔴 P0', p0.length);
  html += makeFilterChip('1', '🟡 P1', p1.length);
  html += makeFilterChip('2', '🟢 P2', p2.length);
  html += '</div>';
  html += buildSection('🔴','P0 必看',p0);
  html += buildSection('🟡','P1 推荐',p1);
  html += buildSection('🟢','P2 拓展',p2);
  if (!html.includes('news-card')) html = '<div class="empty-state"><div class="icon">🔍</div><p>没有找到匹配的资讯</p></div>';
  document.getElementById('panelContent').innerHTML = html;
}

function makeFilterChip(val, label, count) {
  var active = currentFilter === val ? ' active' : '';
  return '<div class="filter-chip' + active + '" data-filter="' + val + '">'+label+' ('+count+')</div>';
}

function buildSection(emoji, title, items) {
  if (!items.length) return '';
  var cards = items.map(function(item){ return cardHTML(item); }).join('');
  return '<div class="section"><div class="section-title">' + emoji + ' ' + title + ' <span class="count">(' + items.length + ')</span></div><div class="news-list">' + cards + '</div></div>';
}

function cardHTML(item) {
  var srcClass = {'量子位':'source-qbitai','OpenAI Blog':'source-openai','钛媒体':'source-tmtpost','爱范儿':'source-ifanr'}[item.source] || 'source-qbitai';
  var tags = (item.keywords||[]).slice(0,3).map(function(k){ return '<span>#' + esc(k) + '</span>'; }).join(' ');
  var pubDate = item.published_at ? item.published_at.slice(5,10) : '';
  var url = esc(item.url);
  var emoji = item.priority===0?'🔴':item.priority===1?'🟡':'🟢';
  var card = '<div class="news-card" onclick="window.open(\'' + url + '\',\'_blank\')"><div class="card-top"><div class="card-title">' + esc(item.title) + '</div><div class="priority-badge badge-p' + item.priority + '">' + emoji + '</div></div>';
  if (item.summary) card += '<div class="card-summary">' + esc(item.summary) + '</div>';
  card += '<div class="card-bottom"><span class="card-source ' + srcClass + '">' + esc(item.source) + '</span><span class="card-tags">' + tags + '</span>';
  if (pubDate) card += '<span style="font-size:10px;color:#4b5063">' + pubDate + '</span>';
  card += '<a href="' + url + '" target="_blank" class="card-link" onclick="event.stopPropagation()">原文 \u2192</a></div></div>';
  return card;
}
function getFilteredItems() {
  return allItems.filter(function(item) {
    var matchFilter = currentFilter === 'all' || String(item.priority) === currentFilter;
    var q = currentSearch.toLowerCase();
    var matchSearch = !q || item.title.toLowerCase().includes(q) || (item.summary||'').toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
}

document.addEventListener('click', function(e) {
  var chip = e.target.closest('.filter-chip');
  if (chip) { currentFilter = chip.dataset.filter; renderMain(); return; }
});

function onSearch(q) { currentSearch = q; renderMain(); }

function reloadData() {
  document.getElementById('panelContent').innerHTML = '<div class="loading"><div class="spinner"></div><div>正在刷新...</div></div>';
  if (window.__AI_DATA__ && window.__AI_DATA__.length > 0) {
    allItems = window.__AI_DATA__;
    doRender();
  } else {
    loadFromServer(new Date().toISOString().slice(0,10));
  }
}

function openFullHTML() {
  window.open('AI日报-' + new Date().toISOString().slice(0,10) + '.html', '_blank');
}

function switchPanel(panel) {
  document.querySelectorAll('.menu-item').forEach(function(b) { b.classList.toggle('active', b.dataset.panel === panel); });
  if (panel === 'news') { renderMain(); }
  else if (panel === 'notes') { renderNotesPanel(); }
  else {
    var labels = {investment:'📈 投资参考', inspiration:'💡 每日灵感'};
    document.getElementById('panelContent').innerHTML = '<div class="empty-state"><div class="icon">' + (labels[panel] ? labels[panel].split(' ')[0] : '📋') + '</div><p>' + (labels[panel] ? labels[panel].split(' ').slice(1).join(' ') : panel) + '<br>即将上线，敬请期待</p></div>';
  }
}

var NOTES_KEY = 'ai-news-notes';
var HISTORY_KEY = 'ai-news-notes-history';

function renderNotesPanel() {
  var saved = localStorage.getItem(NOTES_KEY) || '';
  document.getElementById('panelContent').innerHTML = '<div style="padding:16px 24px;flex:1;display:flex;flex-direction:column;height:100%"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0"><h2 style="font-size:16px;font-weight:700;color:#fff">✏️ 思考速记</h2><div style="display:flex;gap:6px"><button onclick="clearNotes()" style="background:transparent;color:var(--muted);border:1px solid var(--border);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer">清空</button><button onclick="saveNotes()" style="background:rgba(96,165,250,.12);color:var(--accent);border:none;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600">💾 保存</button></div></div><p style="font-size:11px;color:var(--muted);margin-bottom:10px;flex-shrink:0">自动保存至浏览器本地</p><textarea id="notesArea" placeholder="记录你的想法、灵感、重要洞察..." style="flex:1;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--text);resize:none;outline:none;font-family:inherit;line-height:1.7;flex-shrink:1">' + saved.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</textarea><div id="noteHistory" class="note-history" style="margin-top:14px;flex-shrink:0"></div></div>';
  setTimeout(function(){ initNotes(); }, 10);
}

function saveNotes() {
  var area = document.getElementById('notesArea');
  if (!area) return;
  var text = area.value;
  localStorage.setItem(NOTES_KEY, text);
  var history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  history.unshift({time: new Date().toLocaleString('zh-CN'), text: text});
  if (history.length > 10) history.pop();
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  renderNoteHistory();
  var btn = document.querySelector('.btn-save');
  if (btn) { btn.textContent = '✅ 已保存'; setTimeout(function(){ btn.textContent = '💾 保存'; }, 1500); }
}

function clearNotes() {
  if (confirm('确定清空所有笔记？')) {
    localStorage.removeItem(NOTES_KEY);
    var area = document.getElementById('notesArea');
    if (area) area.value = '';
    renderNoteHistory();
  }
}

function renderNoteHistory() {
  var history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  var container = document.getElementById('noteHistory');
  if (!container) return;
  if (!history.length) { container.innerHTML = ''; return; }
  container.innerHTML = '<h4>历史版本</h4>' + history.slice(0,5).map(function(h,i){ return '<div class="note-entry" onclick="restoreNote(' + i + ')"><div class="note-time">' + esc(h.time) + '</div><div>' + esc(h.text).slice(0,80) + (h.text.length>80?'...':'') + '</div></div>'; }).join('');
}

function restoreNote(idx) {
  var history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  var area = document.getElementById('notesArea');
  if (history[idx] && area) area.value = history[idx].text;
}

function initNotes() {
  var area = document.getElementById('notesArea');
  if (!area) return;
  var timer;
  area.addEventListener('input', function() { clearTimeout(timer); timer = setTimeout(saveNotes, 2000); });
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
